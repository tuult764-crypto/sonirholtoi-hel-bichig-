<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Админ</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:900px;margin:0 auto;padding:16px;background:#faf9f7;color:#2b2724}h2{margin:28px 0 8px}input,button{font:inherit;padding:9px;margin:3px 0}input{border:1.5px solid #e6e0d6;border-radius:8px}button{background:#b8763f;color:#fff;border:0;border-radius:8px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #e6e0d6;padding:6px;text-align:left}.msg{color:#b3564f;font-weight:700;min-height:1.4em}.f{display:grid;gap:4px;max-width:520px}</style></head><body>
<h1>Админ</h1><div id="msg" class="msg" role="alert"></div><input id="k" type="password" placeholder="Админ түлхүүр" autocomplete="off"> <button onclick="go()">Нэвтрэх</button>
<h2>Хүлээгдэж буй төлбөр</h2><p>Банкны орлоготой <b>код + дүн</b> таарвал баталгаажуулна.</p><table><thead><tr><th>Код</th><th>И-мэйл</th><th>Материал</th><th>Дүн</th><th></th></tr></thead><tbody id="pt"></tbody></table>
<h2>Материал нэмэх</h2><div class="f"><input id="ti" placeholder="Нэр"><input id="de" placeholder="Товч тайлбар"><input id="ca" placeholder="Ангилал (жнь: 5-р анги)"><input id="pr" type="number" min="0" placeholder="Үнэ (0 = үнэгүй)">
<label>Хавтасны зураг (заавал биш)<input id="cv" type="file" accept="image/*"></label><label>Хэвлэх хуудаснууд (JPG/PNG, дарааллаар нь, 20 хүртэл)<input id="pg" type="file" accept="image/*" multiple></label><button id="add" onclick="add()">Нэмэх</button></div>
<h2>Материалууд</h2><table><thead><tr><th>Нэр</th><th>Үнэ</th><th>Идэвхтэй</th><th>Хуудас</th><th>Зарсан</th><th></th></tr></thead><tbody id="mt"></tbody></table>
<script>
const $=id=>document.getElementById(id);const say=t=>$('msg').textContent=t||'';
async function api(p,b){const r=await fetch('/api/admin/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','x-admin-key':$('k').value},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok){say(j.error||'Алдаа');throw j}say();return j}
const td=(tr,v)=>{const c=tr.insertCell();c.append(v);return c};
async function go(){try{const p=await api('pending'),t=$('pt');t.textContent='';p.forEach(r=>{const tr=t.insertRow();[r.orderNo,r.email,r.title,r.amount+'₮'].forEach(v=>td(tr,v));const b=document.createElement('button');b.textContent='Баталгаажуулах';b.onclick=async()=>{if(confirm(r.orderNo+' · '+r.amount+'₮ орлого ирсэн үү?')){await api('confirm',{orderNo:r.orderNo});go()}};td(tr,b)});if(!p.length)td(t.insertRow(),'Хүлээгдэж буй төлбөр алга');
const m=await api('materials'),mt=$('mt');mt.textContent='';m.forEach(x=>{const tr=mt.insertRow(),ti=document.createElement('input'),pr=document.createElement('input'),ac=document.createElement('input');ti.value=x.title;pr.type='number';pr.value=x.price;pr.style.width='90px';ac.type='checkbox';ac.checked=x.active;
td(tr,ti);td(tr,pr);td(tr,ac);td(tr,String(x.pages));td(tr,String(x.sold));const s=document.createElement('button');s.textContent='Хадгалах';s.onclick=async()=>{await api('materials/'+x.id,{title:ti.value,description:x.description,category:x.category,price:pr.value,active:ac.checked});say('Хадгалагдлаа');go()};td(tr,s)})}catch{}}
async function img(f){const m=await createImageBitmap(f),k=Math.min(1,2000/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=m.width*k;c.height=m.height*k;c.getContext('2d').drawImage(m,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));return{mime:'image/jpeg',data:await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(b)})}}
async function add(){const pg=[...$('pg').files];if(!$('ti').value||(!pg.length&&!$('cv').files[0])){say('Нэр болон зураг оруулна уу');return}if(pg.length>20){say('20-оос олон хуудас оруулж болохгүй');return}
$('add').disabled=true;say('Байршуулж байна...');try{const body={title:$('ti').value,description:$('de').value,category:$('ca').value,price:$('pr').value,pages:await Promise.all(pg.map(img))};if($('cv').files[0])body.cover=await img($('cv').files[0]);await api('materials',body);say('Нэмэгдлээ');['ti','de','ca','pr','cv','pg'].forEach(i=>$(i).value='');go()}catch{}$('add').disabled=false}
</script></body></html>
