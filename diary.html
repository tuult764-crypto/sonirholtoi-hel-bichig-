<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8e3d2"><title>Анирын өдрийн тэмдэглэл</title><style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Kalam:wght@300;400;700&family=Nunito:wght@400;600;700&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 15%,#f8f5e9,#e7e0cf 70%);color:#4b4638;font-family:Nunito,system-ui,sans-serif}.top{max-width:1100px;margin:auto;padding:22px;display:flex;justify-content:space-between;align-items:center}.top a{color:#536a4e;text-decoration:none;font-weight:700}.intro{text-align:center;padding:28px 16px 18px}.intro h1{font:600 clamp(36px,6vw,64px) Caveat,cursive;margin:0;color:#4d6849}.intro p{color:#817965;margin:6px auto;max-width:520px}.desk{min-height:560px;display:grid;place-items:center;padding:22px 14px 60px;perspective:1800px}.cover{position:relative;width:min(92vw,760px);min-height:480px;border-radius:8px 18px 18px 8px;background:linear-gradient(115deg,#607d59,#77916d 55%,#526f4d);box-shadow:14px 20px 40px #51472b35,inset 5px 0 9px #263d2b66,inset -2px 0 3px #ffffff55;display:grid;place-items:center;text-align:center;color:#f7f0df;transform-origin:left center;transition:transform 1.2s cubic-bezier(.2,.7,.2,1);overflow:hidden}.cover:before{content:"";position:absolute;inset:18px;border:1px solid #d9d2b080;border-radius:4px}.cover:after{content:"";position:absolute;left:24px;top:0;bottom:0;width:12px;background:linear-gradient(90deg,#314d39aa,#ffffff16,#314d3944)}.cover-inner{position:relative;z-index:1;padding:42px}.cover h2{font:600 clamp(46px,8vw,76px) Caveat,cursive;margin:10px 0}.cover p{font:20px Caveat,cursive;color:#e9e2cf}.leaf{font-size:32px;opacity:.8}.open-btn{margin-top:25px;background:#eee6d2;color:#536a4e;border:0;border-radius:30px;padding:13px 28px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px #263d2b44}.book{display:none;width:min(96vw,1000px);min-height:560px;position:relative;filter:drop-shadow(0 18px 20px #51472b25);transform-style:preserve-3d}.book.open{display:grid;grid-template-columns:1fr 1fr;animation:appear .8s ease both}.page{position:relative;background:repeating-linear-gradient(to bottom,#fbf7e9 0,#fbf7e9 31px,#e7dfcc 32px);padding:54px clamp(22px,5vw,62px) 48px;min-height:560px;box-shadow:inset -10px 0 18px #8c7b5420;overflow:hidden}.page:first-child{border-radius:12px 0 0 12px;border-right:1px solid #d8ceb9}.page:last-child{border-radius:0 12px 12px 0;box-shadow:inset 10px 0 18px #8c7b5420}.page h2{font:600 clamp(32px,4vw,48px) Caveat,cursive;color:#536b4d;margin:0 0 12px}.date{font-size:12px;letter-spacing:.08em;color:#9b8d72;text-transform:uppercase;margin-bottom:22px}.writing{font:400 clamp(18px,2.1vw,23px)/1.85 Kalam,cursive;white-space:pre-wrap;color:#554c3b}.page img{max-width:100%;max-height:220px;object-fit:contain;border-radius:4px;margin:12px auto;display:block}.signature{text-align:right;font:600 26px Caveat,cursive;color:#758a68;margin-top:20px}.controls{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:20px}.controls button,.close{border:1px solid #d6cfbd;background:#f8f3e7;color:#5c7054;padding:10px 18px;border-radius:24px;cursor:pointer;font-weight:700}.controls button:disabled{opacity:.35;cursor:not-allowed}.count{font-size:13px;color:#847a65}.empty{text-align:center;padding:80px 20px;font:26px Caveat,cursive}.close{display:block;margin:18px auto 0}@keyframes appear{from{opacity:0;transform:rotateY(-12deg) translateY(12px)}to{opacity:1;transform:none}}@media(max-width:680px){.book.open{grid-template-columns:1fr;gap:0}.page{min-height:390px;border-radius:10px!important;border:0!important}.page:first-child{display:none}.page:last-child{box-shadow:0 4px 14px #5b503322}.desk{min-height:450px}.cover{min-height:420px}.top{padding:15px}}
</style></head><body><header class="top"><a href="/">← Сонирхолтой хэл бичиг</a><a href="/admin">Админ</a></header><section class="intro"><h1>Анирын өдрийн тэмдэглэл</h1><p>Миний бодол, миний өдөр, миний найзууд...</p></section><main class="desk"><section id="cover" class="cover"><div class="cover-inner"><div class="leaf">✿</div><h2>Анирын өдрийн тэмдэглэл</h2><p>Зарим өдөр бичиж үлдээмээр санагддаг...</p><button class="open-btn" id="openBook">Дэвтрийг нээх</button></div></section><section id="book" class="book" aria-label="Анирын тэмдэглэл"><article class="page" id="leftPage"><div class="date" id="leftDate"></div><h2 id="leftTitle"></h2><div class="writing" id="leftBody"></div></article><article class="page" id="rightPage"><div class="date" id="rightDate"></div><h2 id="rightTitle"></h2><div id="rightImage"></div><div class="writing" id="rightBody"></div><div class="signature">— Анир ♡</div><div class="controls"><button id="prev">← Өмнөх</button><span class="count" id="count">0 / 0</span><button id="next">Дараагийн →</button></div></article></section></main><button id="closeBook" class="close" hidden>Дэвтрээ хаах</button><script>
const $=id=>document.getElementById(id);let entries=[],index=0;function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(){const x=entries[index];if(!x)return;const prev=entries[index-1];$('leftDate').textContent=prev?.date?new Date(prev.date).toLocaleDateString('mn-MN'):'Өмнөх тэмдэглэл';$('leftTitle').textContent=prev?.title||'Дэвтрийн эхний хуудас';$('leftBody').textContent=prev?.excerpt||'Энэ дэвтэрт Анирын бодол, дурсамж, найзуудтайгаа өнгөрүүлсэн өдрүүд хадгалагдана.';$('rightDate').textContent=x.date?new Date(x.date).toLocaleDateString('mn-MN'):'Өдрийн тэмдэглэл';$('rightTitle').textContent=x.title;$('rightBody').textContent=x.body;$('rightImage').innerHTML=x.imageUrl?'<img src="'+safe(x.imageUrl)+'" alt="Тэмдэглэлийн зураг">':'';$('count').textContent=(index+1)+' / '+entries.length;$('prev').disabled=index===0;$('next').disabled=index===entries.length-1;$('rightPage').animate([{transform:'rotateY(-8deg)',opacity:.6},{transform:'rotateY(0)',opacity:1}],{duration:420,easing:'ease-out'})}
$('openBook').onclick=async()=>{try{const r=await fetch('/api/diary');if(!r.ok)throw Error();entries=await r.json();if(!entries.length){$('rightPage').innerHTML='<div class="empty">Анир одоохондоо эхний тэмдэглэлээ бичиж байна...<br>Удахгүй уулзацгаая ♡</div>'}else show();$('cover').style.transform='rotateY(-105deg)';$('cover').style.opacity='0';setTimeout(()=>{$('cover').style.display='none';$('book').classList.add('open');$('closeBook').hidden=false},850)}catch{$('rightPage').innerHTML='<div class="empty">Тэмдэглэлийг ачаалж чадсангүй. Дахин оролдоно уу.</div>';}};$('prev').onclick=()=>{if(index>0){index--;show()}};$('next').onclick=()=>{if(index<entries.length-1){index++;show()}};$('closeBook').onclick=()=>{ $('book').classList.remove('open');$('cover').style.display='grid';$('cover').style.opacity='1';$('cover').style.transform='';$('closeBook').hidden=true};let startX=0;$('rightPage').addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});$('rightPage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>55){if(dx<0)$('next').click();else $('prev').click()}},{passive:true});
</script></body></html>
